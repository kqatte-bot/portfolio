html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}

/* ---------- pages (list, about, case) ---------- */

.eyebrow{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-bottom:14px}
.case h1{font-family:var(--f-display);font-weight:500;font-size:clamp(32px,5.6vw,68px);line-height:1.02;letter-spacing:-.02em;margin:0;text-wrap:balance}
.case .sub{font-family:var(--f-ui);font-weight:300;letter-spacing:-.01em;font-size:clamp(19px,2.2vw,24px);line-height:1.3;margin:16px 0 0;color:var(--muted);text-wrap:balance}
.lead{font-size:16px;line-height:1.6;margin:0;max-width:56ch}
.meta{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;margin:22px 0 0;font-size:13px}
.meta dt{color:var(--muted)}
.meta dd{margin:0}
.inside{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px;padding:0;list-style:none}
.inside li{font-size:12px;background:var(--chip);border-radius:99px;padding:5px 10px}
.part{padding-top:56px}
.part-h{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:20px}

.ext{font-size:13px;color:var(--muted);text-decoration:none;white-space:nowrap}
.ext:hover{color:var(--ink)}
.frames{display:flex;flex-direction:column;gap:2px}
.frames.grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:14px;align-items:start}

<script>
(()=>{
const DATA = JSON.parse(document.getElementById('data').textContent);
const {groups, cases, frames} = DATA;
const PROFILE = 'https://deziiign.com/account/2082b28c4429487b8b8f0e5a236fb356';
const bySlug = Object.fromEntries(cases.map(c=>[c.slug,c]));
const gById = Object.fromEntries(groups.map(g=>[g.id,g]));
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc = s => String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const order = cases.map(c=>c.slug);

/* ---------------- spiral ---------------- */
const cv = document.getElementById('stage'), ctx = cv.getContext('2d');
const tip = document.getElementById('tip');
let W=0,H=0,DPR=1;
const cam = {x:0,y:0,z:1};
let rot = 0, focus = null, hover = null, active = true;
const TWIST = 0.0056;
const N = groups.length;
const armBase = gi => gi*2*Math.PI/N - Math.PI/2;
const armPoint = (gi,r) => { const a = armBase(gi) + r*TWIST; return [Math.cos(a)*r, Math.sin(a)*r]; };

// 1. lay frames along each arm, spaced by their own size so neighbours do not touch
const nodes = [];
groups.forEach((g,gi)=>{
  const fr = frames.filter(f=>bySlug[f.case] && bySlug[f.case].g===g.id);
  const byCase = {}; fr.forEach(f=>(byCase[f.case]=byCase[f.case]||[]).push(f));
  const lists = Object.values(byCase); const mixed=[];
  for(let i=0; lists.some(l=>l.length); i++){ const l=lists[i%lists.length]; if(l.length) mixed.push(l.shift()); }
  let r = 90, prev = null;
  mixed.forEach((f,j)=>{
    const size = 84 + Math.min(1, r/900)*44;            // longest side, world units
    const k = Math.min(f.w,f.h)/Math.max(f.w,f.h);
    const w = f.w>=f.h? size : size*k, h = f.h>f.w? size : size*k;
    const rad = Math.hypot(w,h)/2;
    if(prev){ // walk outwards until there is room after the previous frame
      for(let guard=0; guard<4000; guard++){
        const [x,y]=armPoint(gi,r); if(Math.hypot(x-prev.x,y-prev.y) >= (rad+prev.rad)*0.86+8) break; r += 1.5;
      }
    }
    const [x,y]=armPoint(gi,r);
    const n = {f, g:g.id, arm:gi, x, y, w, h, rad, ht:0, img:null, big:null, bigWanted:false};
    nodes.push(n); prev = n;
  });
});
// 2. relax: push apart any frames from different arms that still overlap
for(let it=0; it<160; it++){
  let movedAny=false;
  for(let i=0;i<nodes.length;i++) for(let j=i+1;j<nodes.length;j++){
    const A=nodes[i],B=nodes[j]; const dx=B.x-A.x, dy=B.y-A.y; const d=Math.hypot(dx,dy)||0.01; const need=(A.rad+B.rad)*0.86+8;
    if(d<need){ const m=(need-d)/2, ux=dx/d, uy=dy/d; A.x-=ux*m; A.y-=uy*m; B.x+=ux*m; B.y+=uy*m; movedAny=true; }
  }
  if(!movedAny) break;
}
nodes.forEach(n=>{ n.r=Math.hypot(n.x,n.y); n.a=Math.atan2(n.y,n.x); });
const maxR = Math.max(...nodes.map(n=>n.r+n.rad));
const armEnd = groups.map((g,gi)=>{
  const ns = nodes.filter(n=>n.arm===gi); let far=ns[0]; ns.forEach(n=>{ if(n.r>far.r) far=n; });
  return far?{r:far.r+far.rad+60,a:far.a+0.1}:{r:300,a:armBase(gi)};
});

// 3. images: small file first, sharp file once a frame is shown large
nodes.forEach(n=>{ const im=new Image(); im.decoding='async'; im.onload=()=>{n.img=im}; im.src=n.f.s; });
function wantBig(n){ if(n.bigWanted) return; n.bigWanted=true; const im=new Image(); im.decoding='async'; im.onload=()=>{n.big=im}; im.src=n.f.m; }

function fit(){
  const s = Math.min(W,H);
  const narrow = W < 600;
  cam.z = Math.max(.08, Math.min(1.5, (s*(narrow?0.6:0.5))/ (maxR + (narrow?0:110))));
  cam.x = 0; cam.y = narrow ? 90/cam.z : 0;
}
function resize(){
  DPR = Math.min(2, devicePixelRatio||1);
  W = innerWidth; H = innerHeight;
  cv.width = W*DPR; cv.height = H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px';
  if(!resize.done){fit(); resize.done=true}
}
addEventListener('resize', resize); resize();

function pos(n){ const a = n.a + rot; return [Math.cos(a)*n.r, Math.sin(a)*n.r]; }
function toScreen(x,y){ return [W/2 + (x-cam.x)*cam.z, H/2 + (y-cam.y)*cam.z]; }
function toWorld(sx,sy){ return [(sx-W/2)/cam.z + cam.x, (sy-H/2)/cam.z + cam.y]; }

function drawTrail(gi, col){
  ctx.fillStyle = col;
  for(let r=40; r<armEnd[gi].r; r+=9){
    const a = armBase(gi) + r*TWIST + rot + Math.sin(r*0.05)*0.02;
    const [sx,sy] = toScreen(Math.cos(a)*r, Math.sin(a)*r);
    const rr = (1.2 + (r%27)/27*2.6) * Math.max(.6,cam.z);
    ctx.beginPath(); ctx.ellipse(sx,sy,rr*1.6,rr,a,0,Math.PI*2); ctx.fill();
  }
}
const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
let drawOrder = nodes.slice();
let last = 0;
function frame(t){
  const dt = Math.min(50, t-last||16); last=t;
  if(active){
    if(!reduce && !drag && !hover) rot += 0.00016*dt/16;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.clearRect(0,0,W,H);
    const trail = css('--trail');
    groups.forEach((g,gi)=>drawTrail(gi, trail));
    const step = reduce ? 1 : dt/160;
    nodes.forEach(n=>{ n.ht = Math.max(0, Math.min(1, n.ht + (hover===n? step : -step))); });
    drawOrder = nodes.slice().sort((a,b)=>a.ht-b.ht);
    const ink = css('--ink');
    for(const n of drawOrder){
      const [wx,wy]=pos(n); const [sx,sy]=toScreen(wx,wy);
      const e = ease(n.ht); const sc = 1 + 1.25*e;
      const w = n.w*cam.z*sc, h = n.h*cam.z*sc;
      n.box=[sx-w/2,sy-h/2,w,h];
      if(sx+w<0||sy+h<0||sx-w>W||sy-h>H) continue;
      if(Math.max(w,h)*DPR > 260) wantBig(n);
      const dim = focus && n.g!==focus;
      ctx.globalAlpha = dim? .14 : 1;
      if(e>0.01){ ctx.save(); ctx.shadowColor='rgba(0,0,0,'+(0.28*e)+')'; ctx.shadowBlur=28*e; ctx.shadowOffsetY=10*e; ctx.fillStyle='#fff'; ctx.fillRect(sx-w/2,sy-h/2,w,h); ctx.restore(); }
      const src = n.big || n.img;
      if(src){ ctx.imageSmoothingQuality='high'; ctx.drawImage(src, sx-w/2, sy-h/2, w, h); }
      else { ctx.fillStyle = css('--chip'); ctx.fillRect(sx-w/2,sy-h/2,w,h); }
    }
    ctx.globalAlpha=1;
    ctx.font = `500 13px ${css('--f-ui')}`;
    ctx.textBaseline='middle';
    groups.forEach((g,gi)=>{
      const e=armEnd[gi]; const a=e.a+rot; const [sx,sy]=toScreen(Math.cos(a)*e.r, Math.sin(a)*e.r);
      ctx.globalAlpha = (focus && focus!==g.id)?.3:1;
      if(W>=600){
        const tw = ctx.measureText(g.name).width, px = sx-20, py = sy-13, pw = tw+34, ph = 26;
        ctx.fillStyle = css('--paper'); ctx.strokeStyle = css('--line'); ctx.lineWidth = 1;
        ctx.beginPath(); ctx.roundRect ? ctx.roundRect(px,py,pw,ph,13) : ctx.rect(px,py,pw,ph); ctx.fill(); ctx.stroke();
        ctx.fillStyle = ink; ctx.textAlign='left'; ctx.fillText(g.name, sx, sy);
      }
      ctx.fillStyle = css('--g-'+g.id);
      ctx.beginPath(); ctx.arc(sx-9, sy, 3.5, 0, Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha=1;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// interaction
let drag=null, moved=0; const pts=new Map(); let pinch=null;
function pick(sx,sy){
  for(let i=drawOrder.length-1;i>=0;i--){ const b=drawOrder[i].box; if(b && sx>=b[0]&&sx<=b[0]+b[2]&&sy>=b[1]&&sy<=b[1]+b[3]) return drawOrder[i]; }
  return null;
}
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId); pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pts.size===2){ const [a,b]=[...pts.values()]; pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]), z:cam.z}; drag=null; return; }
  drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y}; moved=0; cv.classList.add('drag');
});
cv.addEventListener('pointermove',e=>{
  if(pts.has(e.pointerId)) pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pinch && pts.size===2){ const [a,b]=[...pts.values()]; const d=Math.hypot(a[0]-b[0],a[1]-b[1]); cam.z=Math.max(.08,Math.min(5,pinch.z*d/pinch.d)); return; }
  if(drag){ const dx=e.clientX-drag.x, dy=e.clientY-drag.y; moved=Math.max(moved,Math.hypot(dx,dy)); cam.x=drag.cx-dx/cam.z; cam.y=drag.cy-dy/cam.z; hideTip(); return; }
  if(e.pointerType==='mouse'){
    const n=pick(e.clientX,e.clientY); hover=n; cv.classList.toggle('hot',!!n);
    if(n){ const c=bySlug[n.f.case]; tip.innerHTML=`<b>${esc(c.title)}</b><span>${esc(gById[c.g].name)} · ${esc(c.year)}</span>`; tip.style.left=e.clientX+'px'; tip.style.top=e.clientY+'px'; tip.hidden=false; }
    else hideTip();
  }
});
function hideTip(){ tip.hidden=true; }
function up(e){
  pts.delete(e.pointerId); if(pts.size<2) pinch=null;
  if(drag && moved<6){ const n=pick(e.clientX,e.clientY); if(n){ location.hash='case-'+n.f.case; } }
  drag=null; cv.classList.remove('drag');
}
cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
cv.addEventListener('pointerleave',()=>{ if(!drag){hover=null;hideTip();cv.classList.remove('hot')} });
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const [wx,wy]=toWorld(e.clientX,e.clientY);
  const z = Math.max(.08, Math.min(5, cam.z*Math.exp(-e.deltaY*0.0015)));
  cam.z=z; const [nx,ny]=toWorld(e.clientX,e.clientY); cam.x+=wx-nx; cam.y+=wy-ny;
},{passive:false});

// legend
const legend=document.getElementById('legend');
legend.innerHTML = groups.map(g=>{
  const n = cases.filter(c=>c.g===g.id).length;
  return `<button type="button" data-g="${g.id}" style="--c:var(--g-${g.id})"><i class="dot"></i>${esc(g.name)} <span class="count">${n}</span></button>`;
}).join('');
legend.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  focus = focus===b.dataset.g? null : b.dataset.g;
  legend.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.g===focus));
});

/* ---------------- pages ---------------- */
const view=document.getElementById('view');
const img = (src,alt,w,h,lazy=true)=>`<img src="${esc(src)}" alt="${esc(alt)}" ${w?`width="${w}" height="${h}"`:''} ${lazy?'loading="lazy"':''} decoding="async">`;

function listPage(){
  return `<div class="page"><div class="wrap">${groups.map(g=>`
    <section class="group" id="g-${g.id}">
      <div><h2><i class="dot" style="--c:var(--g-${g.id})"></i>${esc(g.name)}</h2><p>${esc(g.blurb)}</p></div>
      <div class="cards">${cases.filter(c=>c.g===g.id).map(c=>`
        <a class="card" href="#case-${c.slug}">
          <div class="cv">${img(c.parts[0].cover, c.title, 900, 1263)}</div>
          <div><b>${esc(c.title)}</b><span>${esc(c.sub)}</span></div>
          <div class="yr">${esc(c.year)}</div>
        </a>`).join('')}</div>
    </section>`).join('')}</div></div>`;
}

function casePage(c){
  const g=gById[c.g]; const i=order.indexOf(c.slug);

  return `<div class="page"><article class="case">
    <a class="back" href="#list">← Все работы</a>
    <header class="case-head">
      <div>
        <div class="eyebrow"><i class="dot" style="--c:var(--g-${g.id})"></i>${esc(g.name)}</div>
        <h1>${esc(c.title)}</h1>
        <p class="sub">${esc(c.sub)}</p>
      </div>
      <div>
        <p class="lead">${esc(c.lead)}</p>
        <dl class="meta">
          <dt>Год</dt><dd>${esc(c.year)}</dd>
          ${c.team?`<dt>Формат</dt><dd>${esc(c.team)}</dd>`:''}
        </dl>
        <div class="btns">${c.links.map((l,k)=>`<a class="btn${k===0?' primary':''}" href="${esc(l[1])}" target="_blank" rel="noopener">${esc(l[0])} ↗</a>`).join('')}</div>
      </div>
    </header>
    ${c.parts.map(p=>`
      <section class="part">
        ${p.label?`<div class="part-h"><h3>${esc(p.label)}</h3>${p.url?`<a class="ext" href="${esc(p.url)}" target="_blank" rel="noopener">Открыть на Deziiign ↗</a>`:''}</div>`:''}
        <div class="frames${p.cols?' grid':''}" ${p.cols?`style="--cols:${p.cols}"`:''}>${p.images.map((im,k)=>img(im[0], `${c.title}, слайд ${k+1}`, im[1], im[2])).join('')}</div>
        ${p.more?`<p class="more">Это часть презентации. <a href="${esc(p.url)}" target="_blank" rel="noopener">Полная версия на Deziiign ↗</a></p>`:''}
      </section>`).join('')}
    <nav class="next" aria-label="Другие проекты">
      <a href="#case-${prev.slug}"><span>← Предыдущий</span><b>${esc(prev.title)}</b></a>
      <a href="#case-${next.slug}"><span>Следующий →</span><b>${esc(next.title)}</b></a>
    </nav>
    <p class="next-contact">Хотите обсудить проект? Telegram <a href="https://t.me/kqatte" target="_blank" rel="noopener">@kqatte</a> или почта <a href="mailto:kqatte@mail.ru">kqatte@mail.ru</a></p>
  </article></div>`;
}

function aboutPage(){
  return `<div class="page"><div class="about">
    <div class="about-head">
      <img src="img/me.webp" alt="Екатерина Федорова" width="520" height="650">
      <div><h1>Екатерина Федорова</h1><p>Продакт-менеджер и дизайнер</p></div>
    </div>
    <p>Учусь в НИУ ВШЭ на направлении «Управление в креативных индустриях». Сейчас работаю бренд-менеджером блогера: создаю его личный бренд и веду запуск его продукта.</p>
    <p>Веду проекты от идеи до запуска: исследую рынок и целевую аудиторию, создаю визуальный стиль, проектирую и запускаю цифровой MVP, занимаюсь продвижением и рекламой.</p>
    <h2>Навыки и инструменты</h2>
    <div class="skills">
      <div><h3>Умею</h3><ul>${['Анализ рынка','Исследование ЦА','Фирменный стиль и визуал','Личный бренд','Рекламные креативы','Продающие тексты','Грамотные тексты и редактура','Работа с ИИ-инструментами'].map(x=>`<li>${x}</li>`).join('')}</ul></div>
      <div><h3>Инструменты</h3><ul>${['Figma','Adobe Illustrator','Adobe Photoshop','Excel','PowerPoint','HTML','CSS','JavaScript'].map(x=>`<li>${x}</li>`).join('')}</ul></div>
    </div>
    <h2>Направления</h2>
    <ul class="dirs">${groups.map(g=>`<li><a href="#list" data-g="${g.id}"><i class="dot" style="--c:var(--g-${g.id})"></i>${esc(g.name)}</a><span class="yr">${cases.filter(c=>c.g===g.id).length} ${plural(cases.filter(c=>c.g===g.id).length)}</span></li>`).join('')}</ul>
    <h2>Контакты</h2>
    <dl class="contacts">
      <dt>Telegram</dt><dd><a href="https://t.me/kqatte" target="_blank" rel="noopener">@kqatte</a></dd>
      <dt>Почта</dt><dd><a href="mailto:kqatte@mail.ru">kqatte@mail.ru</a></dd>
      <dt>Работы</dt><dd><a href="${PROFILE}" target="_blank" rel="noopener">Deziiign ↗</a> · <a href="https://www.behance.net/kqatte" target="_blank" rel="noopener">Behance ↗</a></dd>
    </dl>
  </div></div>`;
}
function plural(n){ const m10=n%10, m100=n%100; if(m10===1&&m100!==11) return 'проект'; if(m10>=2&&m10<=4&&(m100<10||m100>=20)) return 'проекта'; return 'проектов'; }

function route(){
  const h = location.hash.slice(1);
  let r='spiral';
  if(h==='list') r='list'; else if(h==='about') r='about'; else if(h.startsWith('case-') && bySlug[h.slice(5)]) r='case';
  document.querySelectorAll('[data-r]').forEach(a=>{ if(a.dataset.r===r || (r==='case'&&a.dataset.r==='list')) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  const spiral = r==='spiral';
  active = spiral; cv.hidden = !spiral; legend.hidden=!spiral; document.getElementById('hint').hidden=!spiral; hideTip();
  if(r==='list'){ view.innerHTML=listPage(); document.title='Работы · Екатерина Федорова'; }
  else if(r==='about'){ view.innerHTML=aboutPage(); document.title='Обо мне · Екатерина Федорова'; }
  else if(r==='case'){ const c=bySlug[h.slice(5)]; view.innerHTML=casePage(c); document.title=c.title+' · Екатерина Федорова'; }
  else { view.innerHTML=''; document.title='Екатерина Федорова'; }
  if(!spiral) scrollTo(0,0);
  document.body.style.overflow = spiral? 'hidden':'';
}
addEventListener('hashchange', route); route();
// full-screen viewer for slides
let lb=null;
function closeLb(){ if(lb){ lb.remove(); lb=null; document.documentElement.style.overflow=''; } }
view.addEventListener('click',e=>{
  const im=e.target.closest('.frames img'); if(!im) return;
  lb=document.createElement('div'); lb.className='lb'; lb.setAttribute('role','dialog'); lb.setAttribute('aria-label','Слайд');
  const big=new Image(); big.src=im.currentSrc||im.src; big.alt=im.alt;
  const r=im.naturalHeight/im.naturalWidth; if(r>1.6) lb.classList.add('full');
  const x=document.createElement('button'); x.className='lb-x'; x.type='button'; x.setAttribute('aria-label','Закрыть'); x.textContent='×';
  lb.append(big,x); document.body.append(lb); document.documentElement.style.overflow='hidden';
  lb.addEventListener('click',closeLb); x.focus();
});
addEventListener('keydown',e=>{ if(e.key==='Escape') closeLb(); });
addEventListener('hashchange', closeLb);
})();
</script>
