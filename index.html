<style>
/* Layout: a pan-and-zoom spiral of work on a cool paper ground; four arms = four directions.
   Clicking any frame opens a quiet, single-column case page. A list view gives the same work as a grid. */
:root{
  --ground:#e6e7e9;
  --paper:#f1f2f3;
  --ink:#16171a;
  --muted:#6a6e75;
  --line:rgba(22,23,26,.12);
  --trail:rgba(22,23,26,.10);
  --chip:rgba(22,23,26,.06);
  --g-cx:#3b55e6;
  --g-brand:#a8742f;
  --g-theatre:#b23a48;
  --g-research:#3d7a5c;
  --f-display:"Spectral",Georgia,"Times New Roman",serif;
  --f-ui:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --gut-l:max(16px, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#121316;--paper:#191a1e;--ink:#e8e9eb;--muted:#9a9ea6;--line:rgba(232,233,235,.14);
  --trail:rgba(232,233,235,.10);--chip:rgba(232,233,235,.08);
  --g-cx:#8496ff;--g-brand:#d9a25c;--g-theatre:#e57682;--g-research:#79c19c;color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#121316;--paper:#191a1e;--ink:#e8e9eb;--muted:#9a9ea6;--line:rgba(232,233,235,.14);
  --trail:rgba(232,233,235,.10);--chip:rgba(232,233,235,.08);
  --g-cx:#8496ff;--g-brand:#d9a25c;--g-theatre:#e57682;--g-research:#79c19c;color-scheme:dark}

html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:4px}

/* ---------- top bar ---------- */
.top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
  padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:12px;padding-left:var(--gut-l);padding-right:var(--gut-r);pointer-events:none}
.top > *{pointer-events:auto}
.name{font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1.1;letter-spacing:-.01em;text-decoration:none}
.name small{display:block;font-family:var(--f-ui);font-size:12px;color:var(--muted);letter-spacing:0;margin-top:4px}
.nav{display:flex;gap:4px;align-items:center}
.nav a{font-size:13px;text-decoration:none;padding:6px 10px;border-radius:99px;color:var(--muted)}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{color:var(--ink);background:var(--chip)}

/* ---------- spiral ---------- */
#stage{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#stage.drag{cursor:grabbing}
#stage.hot{cursor:pointer}
.legend{position:fixed;left:var(--gut-l);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.legend button{display:flex;align-items:center;gap:8px;background:none;border:0;padding:2px 0;cursor:pointer;color:var(--muted);text-align:left}
.legend button:hover,.legend button.on{color:var(--ink)}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--c)}
.count{font-family:var(--f-mono);font-size:11px;opacity:.7}
.tip{position:fixed;z-index:30;pointer-events:none;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;line-height:1.3;max-width:240px;box-shadow:0 6px 20px rgba(0,0,0,.08);transform:translate(12px,12px)}
.tip b{font-weight:500;display:block}
.tip span{color:var(--muted);font-size:12px}
.hint{position:fixed;right:var(--gut-r);bottom:calc(30px + env(safe-area-inset-bottom,0px));z-index:15;font-size:12px;color:var(--muted);text-align:right;max-width:170px}

/* segmented switch, bottom centre */
.switch{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:25;display:flex;gap:2px;padding:4px;border-radius:99px;
  background:var(--paper);border:1px solid var(--line);box-shadow:0 8px 28px rgba(0,0,0,.10)}
.switch a{display:flex;align-items:center;gap:7px;text-decoration:none;font-size:14px;padding:9px 16px;border-radius:99px;color:var(--muted)}
.switch a[aria-current="page"]{background:var(--ink);color:var(--ground)}
.switch svg{width:15px;height:15px}

/* ---------- pages (list, about, case) ---------- */
.page{position:relative;z-index:10;background:var(--ground);min-height:100%;
  padding-left:var(--gut-l);padding-right:var(--gut-r);padding-block:calc(110px + env(safe-area-inset-top,0px)) 120px}
.wrap{max-width:1160px;margin:0 auto}
.group{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:24px 40px;padding-block:36px;border-top:1px solid var(--line)}
.group:first-child{border-top:0;padding-top:0}
.group h2{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.15;margin:0;text-wrap:balance;display:flex;gap:10px;align-items:baseline}
.group h2 .dot{transform:translateY(-4px)}
.group p{color:var(--muted);margin:10px 0 0;font-size:14px;max-width:32ch}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:28px 20px}
.card{text-decoration:none;display:flex;flex-direction:column;gap:10px;min-width:0}
.card .cv{aspect-ratio:900/1263;max-width:100%;border-radius:6px;overflow:hidden;background:var(--chip)}
.card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.card:hover img{transform:scale(1.03)}
.card b{font-weight:500;font-size:15px;display:block}
.card span{color:var(--muted);font-size:13px;display:block;line-height:1.35}
.yr{font-family:var(--f-mono);font-size:11px;color:var(--muted)}

/* case */
.case{max-width:1100px;margin:0 auto}
.back{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);text-decoration:none;margin-bottom:36px}
.back:hover{color:var(--ink)}
.case-head{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:32px 56px;align-items:end;padding-bottom:40px;border-bottom:1px solid var(--line)}
.eyebrow{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-bottom:14px}
.case h1{font-family:var(--f-display);font-weight:300;font-size:clamp(44px,8vw,96px);line-height:.95;letter-spacing:-.02em;margin:0;text-wrap:balance}
.case .sub{font-family:var(--f-display);font-style:italic;font-weight:300;font-size:clamp(19px,2.2vw,24px);line-height:1.3;margin:16px 0 0;color:var(--muted);text-wrap:balance}
.lead{font-size:16px;line-height:1.6;margin:0;max-width:56ch}
.meta{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;margin:22px 0 0;font-size:13px}
.meta dt{color:var(--muted)}
.meta dd{margin:0}
.inside{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px;padding:0;list-style:none}
.inside li{font-size:12px;background:var(--chip);border-radius:99px;padding:5px 10px}
.part{padding-top:56px}
.part-h{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.part-h h3{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0}
.ext{font-size:13px;color:var(--muted);text-decoration:none;white-space:nowrap}
.ext:hover{color:var(--ink)}
.frames{display:flex;flex-direction:column;gap:2px}
.frames img{display:block;width:100%;height:auto;max-width:100%;background:var(--chip)}
.more{margin-top:18px;font-size:14px;color:var(--muted)}
.next{margin-top:80px;padding-top:28px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.next a{text-decoration:none;display:flex;flex-direction:column;gap:2px}
.next a span{font-size:12px;color:var(--muted)}
.next a b{font-family:var(--f-display);font-weight:400;font-size:26px}
.next a:last-child{text-align:right;margin-left:auto}

/* about */
.about{max-width:760px;margin:0 auto}
.about h1{font-family:var(--f-display);font-weight:300;font-size:clamp(40px,6vw,64px);line-height:1;margin:0 0 28px;letter-spacing:-.015em}
.about p{font-size:17px;line-height:1.6;margin:0 0 18px;max-width:60ch}
.dirs{list-style:none;padding:0;margin:32px 0;display:grid;gap:0;border-top:1px solid var(--line)}
.dirs li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);align-items:baseline}
.dirs a{text-decoration:none;display:flex;gap:10px;align-items:baseline;font-size:17px}
.dirs a .dot{transform:translateY(-2px)}
.contacts{display:grid;grid-template-columns:auto 1fr;gap:10px 24px;margin:8px 0 0;font-size:17px}
.contacts dt{color:var(--muted);font-size:14px;padding-top:3px}
.contacts dd{margin:0;min-width:0;overflow-wrap:anywhere}
.contacts a{text-decoration:none;border-bottom:1px solid var(--line)}
.contacts a:hover{border-color:var(--ink)}
.next-contact{margin-top:28px;font-size:14px;color:var(--muted)}
.next-contact a{color:var(--ink)}

@media (max-width:720px){
  .name{font-size:19px}
  .group{grid-template-columns:minmax(0,1fr);gap:18px}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 12px}
  .case-head{grid-template-columns:minmax(0,1fr);gap:20px}
  .hint{display:none}
  .legend{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .switch a{padding:8px 13px}
  .page{padding-block:calc(96px + env(safe-area-inset-top,0px)) 110px}
}
@media (max-width:480px){ .nav a[href^="https://t.me"]{display:none} .name small{display:none} }
@media (prefers-reduced-motion: reduce){ .card img{transition:none} }

idimogo","x":1416,"y":1899,"w":138,"h":180},{"case":"granicy-vidimogo","x":1556,"y":1899,"w":131,"h":180},{"case":"tolpa","x":1689,"y":1899,"w":128,"h":180},{"case":"tolpa","x":1819,"y":1899,"w":180,"h":136},{"case":"tolpa","x":0,"y":2081,"w":134,"h":180},{"case":"tolpa","x":136,"y":2081,"w":180,"h":133},{"case":"tolpa","x":318,"y":2081,"w":180,"h":113},{"case":"tolpa","x":500,"y":2081,"w":180,"h":143},{"case":"tolpa","x":682,"y":2081,"w":148,"h":180},{"case":"tolpa","x":832,"y":2081,"w":180,"h":115},{"case":"tolpa","x":1014,"y":2081,"w":136,"h":180},{"case":"tolpa","x":1152,"y":2081,"w":180,"h":144},{"case":"tolpa","x":1334,"y":2081,"w":180,"h":145},{"case":"tolpa","x":1516,"y":2081,"w":180,"h":151},{"case":"tolpa","x":1698,"y":2081,"w":180,"h":148},{"case":"tolpa","x":0,"y":2263,"w":180,"h":142},{"case":"tolpa","x":182,"y":2263,"w":145,"h":180},{"case":"tolpa","x":329,"y":2263,"w":180,"h":145},{"case":"tolpa","x":511,"y":2263,"w":180,"h":142}]}}</script>
<script>
(()=>{
const DATA = JSON.parse(document.getElementById('data').textContent);
const {groups, cases, atlas} = DATA;
const PROFILE = 'https://deziiign.com/account/2082b28c4429487b8b8f0e5a236fb356';
const bySlug = Object.fromEntries(cases.map(c=>[c.slug,c]));
const gById = Object.fromEntries(groups.map(g=>[g.id,g]));
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc = s => String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const order = cases.map(c=>c.slug);

/* ---------------- spiral ---------------- */
const cv = document.getElementById('stage'), ctx = cv.getContext('2d');
const tip = document.getElementById('tip');
let W=0,H=0,DPR=1;
const cam = {x:0,y:0,z:1};
let rot = 0, focus = null, hover = null, active = true;
const sheet = new Image(); let sheetOk=false;
sheet.onload=()=>{sheetOk=true}; sheet.src = atlas.src;

// lay out frames on four arms; each arm belongs to a direction
const nodes = [];
groups.forEach((g,gi)=>{
  const frames = atlas.frames.filter(f=>bySlug[f.case].g===g.id);
  // interleave cases so an arm mixes its projects
  const byCase = {}; frames.forEach(f=>(byCase[f.case]=byCase[f.case]||[]).push(f));
  const lists = Object.values(byCase); const mixed=[];
  for(let i=0; lists.some(l=>l.length); i++){ const l=lists[i%lists.length]; if(l.length) mixed.push(l.shift()); }
  const base = gi*Math.PI/2 - Math.PI/4;
  mixed.forEach((f,j)=>{
    const t = j/ Math.max(1,mixed.length-1);
    const r = 70 + j*Math.max(13, 520/Math.max(1,mixed.length)) ;
    const a = base + r*0.0062;
    const jitter = ((j*73)%11 - 5)*1.6;
    const size = 26 + Math.min(1, r/650)*34;
    nodes.push({f, g:g.id, r: r + jitter, a: a + (((j*37)%7)-3)*0.012, size, arm:gi, j});
  });
});
const maxR = Math.max(...nodes.map(n=>n.r));
const armEnd = groups.map((g,gi)=>{
  const ns = nodes.filter(n=>n.arm===gi); const last = ns[ns.length-1]; return last?{r:last.r+70,a:last.a+0.12}:{r:300,a:gi*Math.PI/2};
});

function fit(){
  const s = Math.min(W,H);
  cam.z = Math.max(.35, Math.min(1.4, (s*0.48)/ (maxR+60)));
  cam.x = 0; cam.y = 0;
}
function resize(){
  DPR = Math.min(2, devicePixelRatio||1);
  W = innerWidth; H = innerHeight;
  cv.width = W*DPR; cv.height = H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px';
  if(!resize.done){fit(); resize.done=true}
}
addEventListener('resize', resize); resize();

function pos(n){
  const a = n.a + rot;
  return [Math.cos(a)*n.r, Math.sin(a)*n.r];
}
function toScreen(x,y){ return [W/2 + (x-cam.x)*cam.z, H/2 + (y-cam.y)*cam.z]; }
function toWorld(sx,sy){ return [(sx-W/2)/cam.z + cam.x, (sy-H/2)/cam.z + cam.y]; }

function drawTrail(gi, col){
  ctx.fillStyle = col;
  const base = gi*Math.PI/2 - Math.PI/4;
  for(let r=40; r<armEnd[gi].r; r+=9){
    const a = base + r*0.0062 + rot + Math.sin(r*0.05)*0.02;
    const [sx,sy] = toScreen(Math.cos(a)*r, Math.sin(a)*r);
    const rr = (1.2 + (r%27)/27*2.6) * Math.max(.6,cam.z);
    ctx.beginPath(); ctx.ellipse(sx,sy,rr*1.6,rr,a,0,Math.PI*2); ctx.fill();
  }
}

function frame(t){
  if(active){
    if(!reduce && !drag && !hover) rot += 0.00018;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.clearRect(0,0,W,H);
    const trail = css('--trail');
    groups.forEach((g,gi)=>drawTrail(gi, trail));
    const lineCol = css('--line');
    for(const n of nodes){
      const [wx,wy]=pos(n); const [sx,sy]=toScreen(wx,wy);
      let s = n.size*cam.z; const f=n.f;
      const k = Math.min(f.w,f.h)/Math.max(f.w,f.h);
      let w = f.w>=f.h? s : s*k, h = f.h>f.w? s : s*k;
      const dim = focus && n.g!==focus;
      const hot = hover===n;
      if(hot){ w*=1.8; h*=1.8; }
      n.box=[sx-w/2,sy-h/2,w,h];
      if(sx+w<0||sy+h<0||sx-w>W||sy-h>H) continue;
      ctx.globalAlpha = dim? .16 : 1;
      if(sheetOk) ctx.drawImage(sheet, f.x,f.y,f.w,f.h, sx-w/2, sy-h/2, w, h);
      else { ctx.fillStyle = css('--g-'+n.g); ctx.globalAlpha = dim?.1:.35; ctx.fillRect(sx-w/2,sy-h/2,w,h); }
      if(hot){ ctx.globalAlpha=1; ctx.strokeStyle=css('--ink'); ctx.lineWidth=1; ctx.strokeRect(sx-w/2-.5,sy-h/2-.5,w+1,h+1); }
    }
    ctx.globalAlpha=1;
    // arm labels
    ctx.font = `400 ${Math.round(13)}px ${css('--f-ui')}`;
    ctx.textBaseline='middle';
    groups.forEach((g,gi)=>{
      const e=armEnd[gi]; const a=e.a+rot; const [sx,sy]=toScreen(Math.cos(a)*e.r, Math.sin(a)*e.r);
      const dim = focus && focus!==g.id;
      ctx.globalAlpha = dim?.3:1;
      ctx.fillStyle = css('--g-'+g.id);
      ctx.beginPath(); ctx.arc(sx-10, sy, 3.5, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = css('--ink');
      ctx.textAlign='left';
      ctx.fillText(g.short, sx, sy);
    });
    ctx.globalAlpha=1;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// interaction
let drag=null, moved=0; const pts=new Map(); let pinch=null;
function pick(sx,sy){
  for(let i=nodes.length-1;i>=0;i--){ const b=nodes[i].box; if(b && sx>=b[0]&&sx<=b[0]+b[2]&&sy>=b[1]&&sy<=b[1]+b[3]) return nodes[i]; }
  return null;
}
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId); pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pts.size===2){ const [a,b]=[...pts.values()]; pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]), z:cam.z}; drag=null; return; }
  drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y}; moved=0; cv.classList.add('drag');
});
cv.addEventListener('pointermove',e=>{
  if(pts.has(e.pointerId)) pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pinch && pts.size===2){ const [a,b]=[...pts.values()]; const d=Math.hypot(a[0]-b[0],a[1]-b[1]); cam.z=Math.max(.25,Math.min(5,pinch.z*d/pinch.d)); return; }
  if(drag){ const dx=e.clientX-drag.x, dy=e.clientY-drag.y; moved=Math.max(moved,Math.hypot(dx,dy)); cam.x=drag.cx-dx/cam.z; cam.y=drag.cy-dy/cam.z; hideTip(); return; }
  if(e.pointerType==='mouse'){
    const n=pick(e.clientX,e.clientY); hover=n; cv.classList.toggle('hot',!!n);
    if(n){ const c=bySlug[n.f.case]; tip.innerHTML=`<b>${esc(c.title)}</b><span>${esc(gById[c.g].name)} · ${esc(c.year)}</span>`; tip.style.left=e.clientX+'px'; tip.style.top=e.clientY+'px'; tip.hidden=false; }
    else hideTip();
  }
});
function hideTip(){ tip.hidden=true; }
function up(e){
  pts.delete(e.pointerId); if(pts.size<2) pinch=null;
  if(drag && moved<6){ const n=pick(e.clientX,e.clientY); if(n){ location.hash='case-'+n.f.case; } }
  drag=null; cv.classList.remove('drag');
}
cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
cv.addEventListener('pointerleave',()=>{ if(!drag){hover=null;hideTip();cv.classList.remove('hot')} });
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const [wx,wy]=toWorld(e.clientX,e.clientY);
  const z = Math.max(.25, Math.min(5, cam.z*Math.exp(-e.deltaY*0.0015)));
  cam.z=z; const [nx,ny]=toWorld(e.clientX,e.clientY); cam.x+=wx-nx; cam.y+=wy-ny;
},{passive:false});

// legend
const legend=document.getElementById('legend');
legend.innerHTML = groups.map(g=>{
  const n = cases.filter(c=>c.g===g.id).length;
  return `<button type="button" data-g="${g.id}" style="--c:var(--g-${g.id})"><i class="dot"></i>${esc(g.name)} <span class="count">${n}</span></button>`;
}).join('');
legend.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  focus = focus===b.dataset.g? null : b.dataset.g;
  legend.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.g===focus));
});

/* ---------------- pages ---------------- */
const view=document.getElementById('view');
const img = (src,alt,w,h,lazy=true)=>`<img src="${esc(src)}" alt="${esc(alt)}" ${w?`width="${w}" height="${h}"`:''} ${lazy?'loading="lazy"':''} decoding="async">`;

function listPage(){
  return `<div class="page"><div class="wrap">${groups.map(g=>`
    <section class="group" id="g-${g.id}">
      <div><h2><i class="dot" style="--c:var(--g-${g.id})"></i>${esc(g.name)}</h2><p>${esc(g.blurb)}</p></div>
      <div class="cards">${cases.filter(c=>c.g===g.id).map(c=>`
        <a class="card" href="#case-${c.slug}">
          <div class="cv">${img(c.parts[0].cover, c.title, 900, 1263)}</div>
          <div><b>${esc(c.title)}</b><span>${esc(c.sub)}</span></div>
          <div class="yr">${esc(c.year)}</div>
        </a>`).join('')}</div>
    </section>`).join('')}</div></div>`;
}

function casePage(c){
  const g=gById[c.g]; const i=order.indexOf(c.slug);
  const prev=bySlug[order[(i-1+order.length)%order.length]], next=bySlug[order[(i+1)%order.length]];
  const total = c.parts.reduce((s,p)=>s+p.total,0);
  return `<div class="page"><article class="case">
    <a class="back" href="#list">← Все работы</a>
    <header class="case-head">
      <div>
        <div class="eyebrow"><i class="dot" style="--c:var(--g-${g.id})"></i>${esc(g.name)}</div>
        <h1>${esc(c.title)}</h1>
        <p class="sub">${esc(c.sub)}</p>
      </div>
      <div>
        <p class="lead">${esc(c.lead)}</p>
        <dl class="meta">
          <dt>Год</dt><dd class="yr" style="font-size:13px;color:var(--ink)">${esc(c.year)}</dd>
          ${c.team?`<dt>Формат</dt><dd>${esc(c.team)}</dd>`:''}
          <dt>Теги</dt><dd>${c.tags.map(esc).join(', ')}</dd>
          <dt>Слайдов</dt><dd class="yr" style="font-size:13px;color:var(--ink)">${total}</dd>
        </dl>
        ${c.inside.length?`<ul class="inside" aria-label="Что внутри">${c.inside.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
      </div>
    </header>
    ${c.parts.map(p=>`
      <section class="part">
        <div class="part-h">${p.label?`<h3>${esc(p.label)}</h3>`:'<span></span>'}<a class="ext" href="${esc(p.url)}" target="_blank" rel="noopener">Открыть на Deziiign ↗</a></div>
        <div class="frames">${p.images.map((im,k)=>img(im[0], `${c.title}, слайд ${k+1}`, im[1], im[2])).join('')}</div>
        ${p.total>p.images.length?`<p class="more">Здесь ${p.images.length} из ${p.total} слайдов. <a href="${esc(p.url)}" target="_blank" rel="noopener">Остальные на Deziiign ↗</a></p>`:''}
      </section>`).join('')}
    <nav class="next" aria-label="Другие проекты">
      <a href="#case-${prev.slug}"><span>← Предыдущий</span><b>${esc(prev.title)}</b></a>
      <a href="#case-${next.slug}"><span>Следующий →</span><b>${esc(next.title)}</b></a>
    </nav>
    <p class="next-contact">Хотите обсудить проект? Telegram <a href="https://t.me/kqatte" target="_blank" rel="noopener">@kqatte</a> или почта <a href="mailto:kqatte@mail.ru">kqatte@mail.ru</a></p>
  </article></div>`;
}

function aboutPage(){
  return `<div class="page"><div class="about">
    <h1>Екатерина Федорова</h1>
    <p>Дизайнер, учусь в Школе дизайна НИУ ВШЭ. Работаю на стыке клиентского опыта и визуального языка: исследую пользователей, придумываю механику сервиса и довожу её до бота, лендинга и айдентики.</p>
    <p>Параллельно пишу визуальные исследования о живописи и уже второй год развиваю собственный театральный бренд «А ЕСЛИ».</p>
    <ul class="dirs">${groups.map(g=>`<li><a href="#list" data-g="${g.id}"><i class="dot" style="--c:var(--g-${g.id})"></i>${esc(g.name)}</a><span class="yr">${cases.filter(c=>c.g===g.id).length} ${plural(cases.filter(c=>c.g===g.id).length)}</span></li>`).join('')}</ul>
    <dl class="contacts">
      <dt>Telegram</dt><dd><a href="https://t.me/kqatte" target="_blank" rel="noopener">@kqatte</a></dd>
      <dt>Почта</dt><dd><a href="mailto:kqatte@mail.ru">kqatte@mail.ru</a></dd>
      <dt>Работы</dt><dd><a href="${PROFILE}" target="_blank" rel="noopener">Профиль на Deziiign ↗</a></dd>
    </dl>
  </div></div>`;
}
function plural(n){ const m10=n%10, m100=n%100; if(m10===1&&m100!==11) return 'проект'; if(m10>=2&&m10<=4&&(m100<10||m100>=20)) return 'проекта'; return 'проектов'; }

function route(){
  const h = location.hash.slice(1);
  let r='spiral';
  if(h==='list') r='list'; else if(h==='about') r='about'; else if(h.startsWith('case-') && bySlug[h.slice(5)]) r='case';
  document.querySelectorAll('[data-r]').forEach(a=>{ if(a.dataset.r===r || (r==='case'&&a.dataset.r==='list')) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  const spiral = r==='spiral';
  active = spiral; cv.hidden = !spiral; legend.hidden=!spiral; document.getElementById('hint').hidden=!spiral; hideTip();
  if(r==='list'){ view.innerHTML=listPage(); document.title='Работы · Екатерина Федорова'; }
  else if(r==='about'){ view.innerHTML=aboutPage(); document.title='Обо мне · Екатерина Федорова'; }
  else if(r==='case'){ const c=bySlug[h.slice(5)]; view.innerHTML=casePage(c); document.title=c.title+' · Екатерина Федорова'; }
  else { view.innerHTML=''; document.title='Екатерина Федорова'; }
  if(!spiral) scrollTo(0,0);
  document.body.style.overflow = spiral? 'hidden':'';
}
addEventListener('hashchange', route); route();
})();
